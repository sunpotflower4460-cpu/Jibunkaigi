<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts: ゴシック(Noto Sans JP) + 明朝(Noto Serif JP)。Apple 端末は内蔵フォントを
         優先するため実ファイルはほぼ読まれず、非 Apple 端末のみフォールバックとして取得する。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@500;600;700&display=swap"
    />

    <title>じぶん会議 — 5つの視点で、じぶんに潜る</title>
    <meta
      name="description"
      content="問いを書くと、5つの内なる視点が静かに応答する内省AIアプリ。導かない。照らすだけ。歩くのは、あなた自身。"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="じぶん会議" />
    <meta property="og:title" content="じぶん会議 — 5つの視点で、じぶんに潜る" />
    <meta
      property="og:description"
      content="問いを書くと、5つの内なる視点が静かに応答する内省AIアプリ。導かない。照らすだけ。歩くのは、あなた自身。"
    />
    <meta property="og:locale" content="ja_JP" />
    <!-- TODO: og:image を 1200×630 png で用意し、/og-image.png として配置すること -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="じぶん会議 — 5つの視点で、じぶんに潜る" />
    <meta
      name="twitter:description"
      content="問いを書くと、5つの内なる視点が静かに応答する内省AIアプリ。"
    />

    <!-- iOS / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="じぶん会議" />
    <!-- TODO: apple-touch-icon (180×180 png) を /apple-touch-icon.png として配置すること -->

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      このアプリは JavaScript が必要です。ブラウザの設定で JavaScript を有効にしてからもう一度お試しください。
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
