name: Run Phase

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase ID to run'
        required: true
        default: 'phase-1'
        type: choice
        options:
          - phase-1

jobs:
  # ── Step 1: 自動検証 ──────────────────────────────────────────────────────────
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml
    with:
      phase: ${{ inputs.phase }}

  # ── Step 2: Wide Reviewer 向け Issue 作成 ────────────────────────────────────
  create-review-issues:
    name: Create Review Issues
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Wide Review / Code issue
        uses: actions/github-script@v7
        with:
          script: |
            const phase = '${{ inputs.phase }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${phase}] Wide Review / Code`,
              labels: ['review', 'wide-review-code'],
              body: [
                `## ${phase} Wide Reviewer / Code`,
                '',
                `CI run: ${runUrl}`,
                '',
                '### チェック観点 (review-rules.md より)',
                '- [ ] 設計図 (product-spec.md / phases.yaml) とのズレがないか',
                '- [ ] 責務分離が保たれているか',
                '- [ ] 不要な複雑化がないか',
                '- [ ] 拡張性を損なっていないか',
                '',
                '### Gate output',
                '1. 今回やったこと:',
                '2. 何が良くなったか:',
                '3. 残っている問題:',
                '4. 次 Phase へ進んでよいか: yes / no',
                '5. あなたの確認が必要な点:',
                '',
                '> レビュー完了後、このIssueを close し、`review-gate` ジョブを承認してください。',
              ].join('\n'),
            });

      - name: Create Wide Review / User issue
        uses: actions/github-script@v7
        with:
          script: |
            const phase = '${{ inputs.phase }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${phase}] Wide Review / User`,
              labels: ['review', 'wide-review-user'],
              body: [
                `## ${phase} Wide Reviewer / User`,
                '',
                `CI run: ${runUrl}`,
                '',
                '### チェック観点 (review-rules.md より)',
                '- [ ] 実際に触った時の自然さ',
                '- [ ] 導線のわかりやすさ',
                '- [ ] 詰まり感がないか',
                '- [ ] 「使いたい」と思えるか',
                '',
                '### Gate output',
                '1. 今回やったこと:',
                '2. 何が良くなったか:',
                '3. 残っている問題:',
                '4. 次 Phase へ進んでよいか: yes / no',
                '5. あなたの確認が必要な点:',
                '',
                '> レビュー完了後、このIssueを close し、`review-gate` ジョブを承認してください。',
              ].join('\n'),
            });

  # ── Step 3: Review Gate (手動承認で止まる) ──────────────────────────────────
  review-gate:
    name: Review Gate
    needs: create-review-issues
    runs-on: ubuntu-latest
    environment: phase-review
    steps:
      - name: Gate passed
        run: |
          echo "✅ ${{ inputs.phase }} review gate passed."
          echo "Wide Review (Code) と Wide Review (User) の両 Issue が close されたことを確認してください。"
