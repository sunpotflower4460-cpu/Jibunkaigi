name: _verify

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      phase:
        description: 'Phase ID being verified'
        required: false
        default: 'phase-1'
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ inputs.phase || 'default' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  verify-mobile:
    name: Verify Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            apps/mobile/package-lock.json

      - name: Install shared dependencies
        working-directory: packages/shared
        run: npm ci

      - name: Typecheck shared
        working-directory: packages/shared
        run: npm run typecheck

      - name: Install mobile dependencies
        run: npm ci

      - name: Lint mobile
        run: npm run lint

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Build check mobile
        run: npm run build:check
