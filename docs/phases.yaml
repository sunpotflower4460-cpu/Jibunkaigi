project:
  name: Jibunkaigi
  goal: >
    人の内側にある複数の傾向が、
    場・反応・姿勢・許可・余韻を通って、
    一時的に言葉として結晶化する体験をつくる。

principles:
  - 固定人格ではなく内的傾向を主役にする
  - 指示や命令より内的力学を重視する
  - 潜在層を主役、表層を薄い翻訳として扱う
  - 便利さより自然さを優先する
  - 説明しすぎず、整理しすぎず、正しさに急がない
  - afterglow は重い記憶ではなく余韻として扱う
  - Joe は死んでいないものを照らす
  - Mirror は未解決点を静かに映す

phase_order:
  - phase-1
  - phase-2
  - phase-3
  - phase-4
  - phase-5
  - phase-6
  - phase-7

phases:
  - id: phase-1
    title: runtime安定化
    summary: >
      止まる・漏れる・戻らないを減らし、
      安心して使える土台を作る。
    goal:
      - loading / generating の安定性を上げる
      - session切替の自然さを上げる
      - stale async completion を抑える
      - 「委ねる」の表示条件と押せる条件を整理する
    do:
      - sessionごとの loading / generating state を整理する
      - 古い async 完了が今の session を汚さないようにする
      - full-screen loading の条件を整理する
      - handleSend / handleAiResponse の finally 復帰を安定させる
      - 「委ねる」の表示条件と押せる条件を分けて整理する
    dont:
      - UI全面改修
      - 大きな新機能追加
      - voiceの大きな再設計
      - 重い記憶機能の導入
    done_when:
      - 新規チャット直後に固まらない
      - session切替で前の loading が残らない
      - AI失敗時でもUIが戻る
      - 「委ねる」が安定して見える
      - 永遠ロードに見える状態が大きく減る

  - id: phase-2
    title: 「委ねる」体験の安定化
    summary: >
      じぶん会議らしい入口である「委ねる」を、
      自然で怖くない体験にする。
    goal:
      - 見つけやすさを上げる
      - 押しやすさを上げる
      - 押した後の安心感を上げる
      - 場に合った感じを強める
    do:
      - 「委ねる」ボタンの存在を安定させる
      - 押したあとに止まらないようにする
      - 何が起きるのか少しだけわかるようにする
      - 戻りやすさを整える
      - ランダム感ではなく場に合った感じを強める
    dont:
      - voiceの全面改修
      - UIの全面作り直し
      - 便利機能の追加でごまかすこと
    done_when:
      - 初見でも「とりあえず委ねてみる」が自然にできる
      - 押したあと不安が少ない
      - 止まったように見えにくい
      - 「場に合った感じ」がある

  - id: phase-3
    title: voiceの自然さ調整
    summary: >
      Joe / Mirror / random voice が、
      固定人格ごっこではなく、
      同じ場から違う角度で出てくる感じを強める。
    goal:
      - Surface Translator の効き方を整える
      - voice差の出し方を整える
      - Joe / Mirror の役割を守る
      - patternMix の自然さを上げる
    do:
      - Surface Translator の効き方を観察して調整する
      - 各voiceの差を役割説明ではなく言葉の傾きで出す
      - Mirror を要約係に戻さない
      - Joe を説明屋や励ます係にしすぎない
      - random voice のバラけすぎを抑える
    dont:
      - runtimeの大改造
      - 長文人格プロンプトでの制御強化
      - 固定人格の厚塗り
    done_when:
      - 声は違うが世界観がバラバラでない
      - 同じ場から生えている感じがある
      - 説明臭さが強すぎない
      - Joe と Mirror の役割が崩れていない

  - id: phase-4
    title: MVP完成
    summary: >
      第三者に渡しても使える最低限の完成度にする。
    goal:
      - 安定性を上げる
      - 最小限のわかりやすさを整える
      - 怖くない体験にする
      - 開発中感を減らす
    do:
      - UIの細部を整える
      - エラー表示を整理する
      - 最小オンボーディングを入れる
      - debug表示を本番で見えすぎないようにする
      - MVPとして必要な説明を README に反映する
    dont:
      - 大規模な新機能追加
      - 見た目だけの豪華化
      - 中身の弱さをUIでごまかすこと
    done_when:
      - 第三者が触っても大きく困らない
      - 怖い無反応が減る
      - 基本導線が安定して通る
      - MVPとして出せる状態になっている

  - id: phase-5
    title: テストと磨き込み
    summary: >
      「使える」を「良い」に近づける。
    goal:
      - 回帰防止を強める
      - 速度を改善する
      - モバイルでの使い心地を整える
      - 余韻と声の自然さを確認する
    do:
      - 手動スモークテストを定型化する
      - loading / session切替 / delegate / title の回帰チェックを行う
      - 複数パターンの対話で質感確認を行う
      - モバイルでの使い心地を調整する
      - 速度改善を行う
    dont:
      - 大きな方向転換
      - 大きな新機能追加
    done_when:
      - 主要導線で大きな不具合が出にくい
      - 速度と安心感が改善している
      - 余韻とvoice差の自然さが一定以上ある

  - id: phase-6
    title: リリース準備
    summary: >
      外に出せる形へ整える。
    goal:
      - 外向け説明を整える
      - スクリーンショットを整える
      - 最低限の運用準備をする
    do:
      - 説明文と紹介文を作る
      - スクリーンショットを整える
      - テスト運用の流れを決める
      - 必要な利用規約やプライバシー整理を行う
    dont:
      - 核の体験を変えるような追加修正
    done_when:
      - 外向けの説明ができる
      - 基本的な公開準備が整っている

  - id: phase-7
    title: リリース後の深化
    summary: >
      じぶん会議らしさを壊さずに少しずつ深くする。
    goal:
      - afterglow を自然にする
      - voice の深度を上げる
      - 軽い継続性を育てる
      - 静かな導線を強める
    do:
      - afterglow をより自然にする
      - Joe / Mirror / 他voiceの質感を深める
      - 軽い振り返りや継続の導線を検討する
      - 小さな記憶や継続性を慎重に育てる
    dont:
      - 重い記憶機能を急いで入れる
      - 便利さ優先で核を薄める
    done_when:
      - 深化しても核が壊れていない
      - 戻ってこられる感じが強まっている